<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO HTML</title>
</head>
<body>
    <header>
        <h1 style="text-align:center; color:saddlebrown;">FORMULARIO HTML</h1>
        <hr>
        <br><br>
    </header>
    <main>
        <form action="#" method="post">
            <p><label for="nombre">Nombre:</label> <input type="text" id="nombre" name="nombre" required></p>
            <p><label for="apellidos">Apellidos:</label> <input type="text" id="apellidos" name="apellidos" required></p>
            <p><label for="correo">Correo electrónico:</label> <input type="email" id="correo" name="correo" required></p>
            <p><label for="telefono">Teléfono:</label> <input type="tel" id="telefono" name="telefono"></p>
            <p>
                <label for="dia">Fecha de nacimiento:</label>
                <select id="dia" name="dia"><option value="">Día</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select>
                <select id="mes" name="mes"><option value="">Mes</option><option value="1">Enero</option><option value="2">Febrero</option><option value="3">Marzo</option><option value="4">Abril</option><option value="5">Mayo</option><option value="6">Junio</option><option value="7">Julio</option><option value="8">Agosto</option><option value="9">Septiembre</option><option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option></select>
                <select id="anio" name="anio"><option value="">Año</option><option value="2000">2000</option><option value="2001">2001</option><option value="2002">2002</option><option value="2003">2003</option><option value="2004">2004</option><option value="2005">2005</option><option value="2006">2006</option><option value="2007">2007</option><option value="2008">2008</option><option value="2009">2009</option><option value="2010">2010</option><option value="2011">2011</option><option value="2012">2012</option><option value="2013">2013</option><option value="2014">2014</option><option value="2015">2015</option><option value="2016">2016</option><option value="2017">2017</option><option value="2018">2018</option><option value="2019">2019</option><option value="2020">2020</option><option value="2021">2021</option><option value="2022">2022</option><option value="2023">2023</option><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option></select>
            </p>
            <p><label for="facebook">Link de Facebook:</label> <input type="url" id="facebook" name="facebook" placeholder="https://facebook.com/tu-perfil"></p>
            <p><label for="password">Contraseña:</label> <input type="password" id="password" name="password"></p>
            <p><label for="obs">Observaciones:</label> <textarea id="obs" name="observaciones" rows="4" cols="30"></textarea></p>
            <p><label for="hermanos">Número de hermanos:</label> <input type="number" id="hermanos" name="hermanos" min="0" value="0"></p>
            <p><label for="genero">Género:</label>
                <select id="genero" name="genero">
                    <option value="">Selecciona</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </p>
            <p><label for="semestre">Semestre:</label>
                <select id="semestre" name="semestre">
                    <option value="">Selecciona</option>
                    <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
                </select>
            </p>
            <p><label for="carrera">Carrera:</label>
                <input list="lista-carreras" id="carrera" name="carrera">
                <datalist id="lista-carreras"><option value="Programación"><option value="Soporte y Mantenimiento de Equipo de Cómputo"><option value="Ofimática"><option value="Contabilidad"><option value="Administración"><option value="Enfermería General"></datalist>
            </p>
            <input type="hidden" name="matricula" value="MATRICULA123456">
            <p>
                <button type="submit">Enviar</button>
                <button type="reset">Borrar</button>
            </p>
        </form>
    </main>
    <footer>
        <br>
        <p><a href="index.html">&larr; Volver al inicio</a></p>
    </footer>
</body>
</html>
